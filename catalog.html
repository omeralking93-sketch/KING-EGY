<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://brrqmpnuoqatbmldqjcd.supabase.co" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>كل المنتجات | KING.EGY</title>
<style>
:root{--bg:#080808;--panel:#151515;--text:#f5f5f5;--muted:#aaa;--line:#333;--accent:#fff;--button-text:#080808;--radius:14px;--image-height:260px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,Tahoma,sans-serif}a{color:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 15px;background:var(--accent);color:var(--button-text);font-weight:bold}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:4}.brand{font-size:25px;font-weight:900;letter-spacing:2px;text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.ghost{background:transparent;color:var(--text);border:1px solid #555;text-decoration:none;display:inline-block;padding:11px 15px;border-radius:8px}.wrap{max-width:1200px;margin:auto;padding:35px 20px}.title{font-size:29px;margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}.image-wrap{position:relative;display:block}.image-wrap img,.art{width:100%;height:var(--image-height);object-fit:cover;display:block}.art{display:grid;place-items:center;background:linear-gradient(135deg,#222,#050505);color:var(--muted);font-size:22px}.badge{position:absolute;top:10px;right:10px;background:#d71920;color:white;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:bold}.info{padding:15px}.info h2{font-size:19px;margin:0 0 8px}.desc{color:var(--muted);line-height:1.6;min-height:0}.price{font-size:21px;font-weight:bold;margin:12px 0}.old{font-size:.78em;color:#999;font-weight:normal}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons a{text-decoration:none}.buttons button{min-height:42px}.status{color:var(--muted);line-height:1.8}.footer{text-align:center;padding:28px;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:520px){.top{padding:12px 4%}.brand{font-size:21px}.wrap{padding:25px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.image-wrap img,.art{height:190px}.info{padding:11px}.info h2{font-size:16px}.price{font-size:18px}.buttons{display:grid}.buttons button{width:100%;padding:10px 7px;font-size:13px}}
</style></head><body>
<header class="top"><a class="brand" href="index.html">KING.EGY</a><div class="actions"><a class="ghost" id="homeLink" href="index.html?lang=ar">الصفحة الرئيسية</a><a class="ghost" id="ordersLink" href="my-orders.html">طلباتي</a><button class="ghost" id="langBtn" type="button">English</button></div></header>
<main class="wrap"><h1 class="title" id="pageTitle">كل المنتجات</h1><div id="productGrid" class="grid"><p class="status">جارٍ تحميل المنتجات...</p></div></main>
<footer class="footer">KING.EGY — <span id="footerText">راحتك أهم</span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar',products=[],settings={};
const db=window.supabase.createClient('https://brrqmpnuoqatbmldqjcd.supabase.co','sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('pageTitle').textContent=lang==='ar'?'كل المنتجات':'All Products';$('homeLink').textContent=lang==='ar'?'الصفحة الرئيسية':'Home';$('homeLink').href='index.html?lang='+lang;$('ordersLink').textContent=settings[lang==='ar'?'my_orders_text_ar':'my_orders_text_en']||(lang==='ar'?'طلباتي':'My orders');$('ordersLink').hidden=settings.my_orders_enabled===false;$('langBtn').textContent=lang==='ar'?'English':'العربية';$('footerText').textContent=lang==='ar'?'راحتك أهم':'Your comfort first';renderProducts()}
function applySettings(s){settings=s||{};const root=document.documentElement;const vars={bg:'--bg',panel:'--panel',text:'--text',muted:'--muted',accent:'--accent',button_text:'--button-text',card_radius:'--radius',product_image_height:'--image-height'};Object.entries(vars).forEach(([k,v])=>{if(settings[k])root.style.setProperty(v,(k==='card_radius'||k==='product_image_height')?settings[k]+'px':settings[k])});if(settings.font)document.body.style.fontFamily=settings.font+',Arial,Tahoma,sans-serif'}
function renderProducts(){if(!products.length){$('productGrid').innerHTML='<p class="status">'+(lang==='ar'?'لا توجد منتجات متاحة حاليًا.':'No products available right now.')+'</p>';return}
$('productGrid').innerHTML=products.map((p,index)=>{const name=lang==='ar'?p.name_ar:p.name_en,desc=lang==='ar'?(p.description_ar||''):(p.description_en||'');const old=Number(p.price_egp)||0,sale=Number(p.discount_price_egp)||0,discount=sale>0&&sale<old,price=discount?sale:old,pct=discount?Math.round((old-sale)/old*100):0;const image=p.image_url?'<img loading="'+(index===0?'eager':'lazy')+'" fetchpriority="'+(index===0?'high':'auto')+'" decoding="async" src="'+esc(p.image_url)+'" alt="'+esc(name)+'">':'<div class="art">KING.EGY</div>';return '<article class="card"><a class="image-wrap" href="product.html?product='+encodeURIComponent(p.slug)+'&lang='+lang+'">'+(discount?'<span class="badge">'+(lang==='ar'?'خصم ':'')+pct+'%'+(lang==='en'?' OFF':'')+'</span>':'')+image+'</a><div class="info"><h2>'+esc(name)+'</h2><p class="desc">'+esc(desc)+'</p><div class="price">'+(discount?'<s class="old">'+old.toLocaleString(lang==='ar'?'ar-EG':'en-US')+' '+(lang==='ar'?'جنيه':'EGP')+'</s><br>':'')+price.toLocaleString(lang==='ar'?'ar-EG':'en-US')+' '+(lang==='ar'?'جنيه':'EGP')+'</div><div class="buttons"><a href="product.html?product='+encodeURIComponent(p.slug)+'&lang='+lang+'"><button type="button">'+(lang==='ar'?'عرض التفاصيل':'View details')+'</button></a><a href="order.html?product='+encodeURIComponent(p.slug)+'&lang='+lang+'"><button type="button" class="ghost">'+(lang==='ar'?'اطلب الآن':'Order now')+'</button></a></div></div></article>'}).join('')}
async function init(){const [pr,st]=await Promise.all([db.from('products').select('id,slug,name_ar,name_en,description_ar,description_en,price_egp,discount_price_egp,image_url').eq('is_active',true).order('sort_order'),db.from('store_settings').select('settings').eq('id',1).maybeSingle()]);if(!pr.error)products=pr.data||[];if(!st.error&&st.data?.settings)applySettings(st.data.settings);applyLang()}
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState({},'',u);applyLang()};
init();
</script></body></html>
