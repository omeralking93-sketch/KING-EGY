<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي | KING.EGY</title><meta name="theme-color" content="#080808">
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font:16px Arial,Tahoma,sans-serif}.wrap{max-width:820px;margin:28px auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:26px;font-weight:900;letter-spacing:2px}a{color:#fff}.card{background:#171717;border:1px solid #383838;border-radius:13px;padding:20px;margin:18px 0}.muted{color:#aaa;line-height:1.7}.error{color:#ff9b9b}.success{color:#a8e6b0}.status{display:inline-block;padding:7px 13px;border:1px solid #777;border-radius:25px;margin:8px 0}.item,.history-row{padding:12px 0;border-bottom:1px solid #333;line-height:1.8}.history-row:last-child,.item:last-child{border:0}.danger{background:#a92828;color:#fff}.btn{display:inline-block;padding:12px 18px;border:0;border-radius:8px;background:#fff;color:#000;font:inherit;font-weight:bold;cursor:pointer;margin-top:10px}.secondary{background:#333;color:#fff}.hidden{display:none}.order-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:550px){.wrap{margin:10px auto}.card{padding:15px}}
</style></head><body><main class="wrap">
<header class="top"><a class="brand" href="index.html" style="text-decoration:none">KING.EGY</a><a href="index.html">العودة للمتجر</a></header>
<section class="card"><h1>طلباتي</h1><p class="muted" id="ordersSubtitle" style="visibility:hidden"></p><div class="actions"><button class="btn secondary" id="refreshBtn" type="button">تحديث الطلبات</button><button class="btn secondary" id="notifyBtn" type="button">تفعيل الإشعارات</button></div><p id="message" class="muted" aria-live="polite">جارٍ تحميل طلباتك...</p></section>
<section id="orders"></section></main>
<script>
const API_URL='https://brrqmpnuoqatbmldqjcd.supabase.co/functions/v1/customer-orders';
const API_KEY='sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU';
function getDeviceToken(){let token=localStorage.getItem('kingegy_device_token');if(!token){token=crypto.randomUUID();localStorage.setItem('kingegy_device_token',token)}return token}
const token=getDeviceToken(),$=id=>document.getElementById(id);
const SETTINGS_URL='https://brrqmpnuoqatbmldqjcd.supabase.co/rest/v1/store_settings?id=eq.1&select=settings';
async function loadOrdersSubtitle(){const el=$('ordersSubtitle');try{const r=await fetch(SETTINGS_URL,{cache:'no-store',headers:{apikey:API_KEY,Authorization:'Bearer '+API_KEY,'Cache-Control':'no-cache'}});if(!r.ok)throw new Error('Settings request failed');const rows=await r.json();const value=rows?.[0]?.settings?.my_orders_subtitle_ar;if(typeof value==='string'&&value.trim())el.textContent=value.trim();else el.textContent='هنا هتظهر تلقائيًا كل الطلبات اللي اتعملت من نفس الجهاز والمتصفح، من غير تسجيل دخول أو أكواد تحقق.'}catch(e){el.textContent='هنا هتظهر تلقائيًا كل الطلبات اللي اتعملت من نفس الجهاز والمتصفح، من غير تسجيل دخول أو أكواد تحقق.'}finally{el.style.visibility='visible'}}
const labels={new:'طلب جديد',confirmed:'تم تأكيد الطلب',preparing:'قيد التجهيز',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'تم إلغاء الطلب'};
let orders=[],timer=null,notificationReady=typeof Notification!=='undefined'&&Notification.permission==='granted';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){return new Date(v).toLocaleString('ar-EG')}
function msg(t,k='muted'){$('message').textContent=t;$('message').className=k}
async function api(action,extra={}){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY,'Authorization':'Bearer '+API_KEY},body:JSON.stringify({action,device_token:token,...extra})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');return data}
function render(list,notify=false){
 const previous=new Map(orders.map(o=>[o.order_number,o.status]));
 orders=list||[];
 if(!orders.length){$('orders').innerHTML='<section class="card"><h3>لسه مفيش طلبات مرتبطة بالجهاز ده</h3><p class="muted">أي طلب جديد هتعمله من نفس الموبايل والمتصفح هيظهر هنا تلقائيًا.</p></section>';return}
 $('orders').innerHTML=orders.map(o=>{
  const changed=previous.has(o.order_number)&&previous.get(o.order_number)!==o.status;
  if(changed&&notify&&notificationReady){try{new Notification('KING.EGY — تحديث الطلب',{body:'طلب '+o.order_number+' أصبح: '+(labels[o.status]||o.status),tag:'king-order-'+o.order_number})}catch(e){}}
  const items=(o.items||[]).map(i=>'<div class="item"><b>'+esc(i.name_ar||i.name_en)+'</b><br>اللون: '+esc(i.color==='Black'?'أسود':i.color==='White'?'رصاصي':i.color)+' — المقاس: '+esc(i.size)+' — الكمية: '+Number(i.quantity)+'<br>'+Number(i.line_total_egp).toLocaleString('ar-EG')+' جنيه</div>').join('');
  const history=(o.history||[]).map(h=>'<div class="history-row"><b>'+esc(labels[h.status]||h.status)+'</b><br><small class="muted">'+fmtDate(h.changed_at)+'</small></div>').join('')||'<p class="muted">لا توجد تحديثات مسجلة بعد.</p>';
  return '<article class="card"><div class="order-head"><h2>طلب رقم '+esc(o.order_number)+'</h2><span class="status">'+esc(labels[o.status]||o.status)+'</span></div><p class="muted">تاريخ الطلب: '+fmtDate(o.created_at)+' — آخر تحديث: '+fmtDate(o.updated_at)+'</p>'+items+'<p><b>الإجمالي: '+Number(o.total_egp).toLocaleString('ar-EG')+' جنيه</b></p><h3>سجل تحديثات الطلب</h3>'+history+( ['new','confirmed','preparing'].includes(o.status) ? '<button class="btn danger cancel" data-order="'+esc(o.order_number)+'">إلغاء الطلب</button>' : '' )+'</article>';
 }).join('');
}
async function load(notify=false){$('refreshBtn').disabled=true;try{const data=await api('list');render(data.orders||[],notify);msg(orders.length?'تم تحميل طلباتك.':'لا توجد طلبات حتى الآن.',orders.length?'success':'muted')}catch(e){msg('تعذر تحميل الطلبات حاليًا. تأكد من اتصال الإنترنت وحاول مرة أخرى.','error')}finally{$('refreshBtn').disabled=false}}
$('refreshBtn').onclick=()=>load(true);
$('orders').addEventListener('click',async e=>{const b=e.target.closest('.cancel');if(!b)return;const number=b.dataset.order;if(!confirm('هل أنت متأكد من إلغاء الطلب؟ يمكنك إلغاؤه قبل الشحن.'))return;b.disabled=true;try{const result=await api('cancel',{order_number:number});if(result.ok){msg('تم إلغاء الطلب بنجاح.','success');await load(false)}else{msg('لا يمكن إلغاء الطلب بعد خروجه من حالة التجهيز.','error');await load(false)}}catch(e){msg('تعذر إلغاء الطلب. حاول مرة أخرى.','error');b.disabled=false}});
$('notifyBtn').onclick=async()=>{if(!('Notification'in window)){msg('المتصفح لا يدعم إشعارات النظام. التحديثات ستظهر عند فتح صفحة طلباتي.');return}const p=await Notification.requestPermission();notificationReady=p==='granted';msg(notificationReady?'تم تفعيل الإشعارات. اترك صفحة طلباتي مفتوحة لاستقبال التنبيهات.':'لم يتم السماح بالإشعارات. ستظهر التحديثات داخل الصفحة.')};
loadOrdersSubtitle();load();timer=setInterval(()=>{if(document.visibilityState==='visible')load(true)},12000);
const warmCache=new Set();
function warmLink(a){const u=a&&a.getAttribute('href');if(!u||u[0]==='#'||u.startsWith('tel:')||u.startsWith('https:'))return;let t;try{t=new URL(u,location.href)}catch(e){return}if(t.origin!==location.origin||!t.pathname.endsWith('.html')||warmCache.has(t.href))return;warmCache.add(t.href);const l=document.createElement('link');l.rel='prefetch';l.href=t.href;document.head.appendChild(l)}
document.addEventListener('pointerover',e=>warmLink(e.target.closest('a')),{passive:true});
document.addEventListener('focusin',e=>warmLink(e.target.closest('a')));
document.addEventListener('touchstart',e=>warmLink(e.target.closest('a')),{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load(true)});
</script></body></html>
