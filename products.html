<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المنتجات | KING.EGY</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font:16px Arial,Tahoma,sans-serif}.wrap{max-width:1100px;margin:25px auto;padding:16px}.brand{font-size:27px;font-weight:900;letter-spacing:2px}.muted{color:#aaa;line-height:1.7}.card{background:#171717;border:1px solid #333;border-radius:13px;padding:18px;margin:14px 0}.hidden{display:none}input,textarea,select,button{font:inherit;padding:12px;border-radius:8px;width:100%;margin:6px 0}input,textarea,select{background:#080808;color:#fff;border:1px solid #555}button{border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer}.secondary{background:#333;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:block;margin:10px 0}.field span{display:block;margin-bottom:5px}.variants{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.variant{background:#101010;border:1px solid #444;border-radius:9px;padding:12px}.variant label{display:flex;align-items:center;gap:8px}.variant input[type=checkbox]{width:auto}.variant input[type=number]{width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{width:auto;flex:1}.preview{max-width:180px;max-height:180px;object-fit:contain;border-radius:8px}.error{color:#ff9999}.success{color:#9ee6aa}.productrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #333;padding:12px 0}.productrow button{width:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:600px){.wrap{margin:8px auto}.actions button{width:100%}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">KING.EGY</div><p class="muted">لوحة إدارة المنتجات — تعديل بصري بدون أكواد</p></div><a href="admin.html" style="color:white">العودة للوحة الطلبات</a></div>
<section id="login" class="card" style="max-width:470px;margin:40px auto"><h2>دخول الإدارة</h2><label class="field"><span>البريد الإلكتروني</span><input id="email" type="email" value="Alkingo651@gmail.com"></label><label class="field"><span>كلمة المرور</span><input id="password" type="password"></label><button id="loginBtn">دخول</button><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="card"><div class="top"><h2>منتجات المتجر</h2><button id="newBtn" style="width:auto">＋ إضافة منتج جديد</button></div><div id="productList">جارٍ التحميل...</div></div>
<div class="card"><h2 id="formTitle">تعديل المنتج</h2><input type="hidden" id="pid"><div class="grid">
<label class="field"><span>اسم المنتج بالعربي</span><input id="name_ar"></label><label class="field"><span>اسم المنتج بالإنجليزي</span><input id="name_en"></label>
<label class="field"><span>رابط المنتج (Slug — يتولد تلقائيًا عند الإضافة)</span><input id="slug"></label><label class="field"><span>السعر بالجنيه</span><input id="price" type="number" min="0" step="1"></label>
<label class="field"><span>وصف المنتج بالعربي</span><textarea id="desc_ar" rows="3"></textarea></label><label class="field"><span>وصف المنتج بالإنجليزي</span><textarea id="desc_en" rows="3"></textarea></label>
<label class="field"><span>ترتيب ظهوره في المتجر</span><input id="sort" type="number" value="1"></label><label class="field"><span>ظهور المنتج</span><select id="active"><option value="true">ظاهر في المتجر</option><option value="false">مخفي</option></select></label>
</div>
<label class="field"><span>صورة المنتج (JPG / PNG / WEBP — حتى 5 ميجابايت)</span><input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview hidden" alt="معاينة الصورة"><p class="muted">الصورة الجديدة تُرفع تلقائيًا وتحل محل الصورة الحالية.</p>
<h3>الألوان والمقاسات المتاحة</h3><p class="muted">فعّل أو أوقف أي لون ومقاس. ويمكن تفعيل متابعة المخزون لكل اختيار.</p><div id="variants" class="variants"></div>
<div class="actions"><button id="saveBtn">حفظ التعديلات</button><button id="hideBtn" class="secondary">إخفاء المنتج</button></div><p id="saveMsg" class="muted"></p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://brrqmpnuoqatbmldqjcd.supabase.co','sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU');
const $=id=>document.getElementById(id), sizes=['M','L','XL','XXL'], colors=[['Black','أسود'],['White','رصاصي']];
let products=[], currentImage=null;
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='تعذر الدخول: '+error.message;$('loginMsg').className='error';return}await start()};
async function start(){const {data:{user}}=await db.auth.getUser();if(!user||user.email?.toLowerCase()!=='alkingo651@gmail.com')return;$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadProducts()}
db.auth.getSession().then(({data})=>{if(data.session)start()});
async function loadProducts(){const {data,error}=await db.from('products').select('*').order('sort_order');if(error){$('productList').textContent='تعذر تحميل المنتجات: '+error.message;return}products=data||[];$('productList').innerHTML=products.map(p=>'<div class="productrow"><div><b>'+esc(p.name_ar)+'</b><div class="muted">'+Number(p.price_egp).toLocaleString('ar-EG')+' جنيه — '+(p.is_active?'ظاهر':'مخفي')+'</div></div><button data-id="'+p.id+'">تعديل</button></div>').join('')||'<p class="muted">لا توجد منتجات بعد.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>editProduct(b.dataset.id))}
function drawVariants(rows=[]){$('variants').innerHTML=colors.flatMap(([color,label])=>sizes.map(size=>{const v=rows.find(x=>x.color===color&&x.size===size)||{};return '<div class="variant" data-color="'+color+'" data-size="'+size+'"><label><input class="vactive" type="checkbox" '+(v.is_active===false?'':'checked')+'> <b>'+label+' — '+size+'</b></label><label><input class="vtrack" type="checkbox" '+(v.track_inventory?'checked':'')+'> متابعة المخزون</label><label>الكمية المتاحة<input class="vqty" type="number" min="0" value="'+(v.stock_quantity??0)+'" '+(v.track_inventory?'':'disabled')+'></label></div>'})).join('');document.querySelectorAll('.vtrack').forEach(c=>c.onchange=()=>{c.closest('.variant').querySelector('.vqty').disabled=!c.checked})}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;$('pid').value=p.id;$('formTitle').textContent='تعديل: '+p.name_ar;$('name_ar').value=p.name_ar;$('name_en').value=p.name_en;$('slug').value=p.slug;$('price').value=p.price_egp;$('desc_ar').value=p.description_ar||'';$('desc_en').value=p.description_en||'';$('sort').value=p.sort_order;$('active').value=String(p.is_active);currentImage=p.image_url;$('image').value='';$('preview').src=p.image_url||'';$('preview').classList.toggle('hidden',!p.image_url);loadVariants(p.id)}
async function loadVariants(id){const {data,error}=await db.from('product_variants').select('*').eq('product_id',id);if(error){$('saveMsg').textContent=error.message;return}drawVariants(data||[])}
function newProduct(){ $('pid').value='';$('formTitle').textContent='إضافة منتج جديد';['name_ar','name_en','slug','price','desc_ar','desc_en'].forEach(id=>$(id).value='');$('sort').value=products.length+1;$('active').value='true';currentImage=null;$('image').value='';$('preview').classList.add('hidden');drawVariants();$('saveMsg').textContent='';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
$('newBtn').onclick=newProduct;
$('image').onchange=()=>{const f=$('image').files[0];if(!f)return;if(f.size>5242880){$('saveMsg').textContent='حجم الصورة أكبر من 5 ميجابايت.';$('image').value='';return}$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden')};
function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'king-product-'+Date.now()}
async function save(){ $('saveBtn').disabled=true;$('saveMsg').textContent='جارٍ الحفظ...';try{const id=$('pid').value;const slug=$('slug').value.trim()||slugify($('name_en').value);const payload={slug,name_ar:$('name_ar').value.trim(),name_en:$('name_en').value.trim(),description_ar:$('desc_ar').value.trim(),description_en:$('desc_en').value.trim(),price_egp:Number($('price').value),image_url:currentImage,is_active:$('active').value==='true',sort_order:Number($('sort').value||0),updated_at:new Date().toISOString()};if(!payload.name_ar||!payload.name_en||!payload.price_egp||payload.price_egp<0)throw Error('اكتب اسم المنتج بالعربي والإنجليزي والسعر بشكل صحيح.');let result;if(id){result=await db.from('products').update(payload).eq('id',id).select().single()}else{result=await db.from('products').insert(payload).select().single()}if(result.error)throw result.error;const product=result.data;const file=$('image').files[0];if(file){const ext=file.name.split('.').pop().toLowerCase();const path=product.id+'/'+Date.now()+'.'+ext;const up=await db.storage.from('product-images').upload(path,file,{upsert:true,contentType:file.type});if(up.error)throw up.error;currentImage=db.storage.from('product-images').getPublicUrl(path).data.publicUrl;const im=await db.from('products').update({image_url:currentImage}).eq('id',product.id);if(im.error)throw im.error}
const rows=[...document.querySelectorAll('.variant')].map(el=>({product_id:product.id,color:el.dataset.color,size:el.dataset.size,is_active:el.querySelector('.vactive').checked,track_inventory:el.querySelector('.vtrack').checked,stock_quantity:el.querySelector('.vtrack').checked?Number(el.querySelector('.vqty').value||0):null}));const upv=await db.from('product_variants').upsert(rows,{onConflict:'product_id,color,size'});if(upv.error)throw upv.error;$('saveMsg').textContent='تم حفظ المنتج والصورة والمقاسات بنجاح.';$('saveMsg').className='success';await loadProducts();$('pid').value=product.id;currentImage=currentImage||product.image_url; }catch(e){$('saveMsg').textContent='لم يتم الحفظ: '+e.message;$('saveMsg').className='error'}finally{$('saveBtn').disabled=false}}
$('saveBtn').onclick=save;
$('hideBtn').onclick=async()=>{if(!$('pid').value){$('saveMsg').textContent='احفظ المنتج أولاً.';return} $('active').value='false';await save()};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
drawVariants();
</script></body></html>
