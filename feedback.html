<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="preconnect" href="https://brrqmpnuoqatbmldqjcd.supabase.co" crossorigin><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>متابعة الشكاوى والاقتراحات | KING.EGY</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font:16px Arial,Tahoma,sans-serif}.wrap{max-width:820px;margin:28px auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:2px;color:#fff;text-decoration:none}.card{background:#171717;border:1px solid #383838;border-radius:13px;padding:20px;margin:18px 0}.muted{color:#aaa;line-height:1.7}.error{color:#ff9b9b}.success{color:#a8e6b0}.tag{display:inline-block;border:1px solid #777;border-radius:25px;padding:7px 13px}.reply{background:#202820;border:1px solid #426348;border-radius:9px;padding:14px;margin-top:14px;line-height:1.8}.btn{padding:11px 16px;border:0;border-radius:8px;background:#fff;color:#000;font:inherit;font-weight:bold;cursor:pointer}.entry{line-height:1.9;border-bottom:1px solid #333;padding:12px 0}.entry:last-child{border:0}@media(max-width:550px){.wrap{margin:8px auto}.card{padding:15px}}</style></head>
<body><main class="wrap"><header class="top"><a class="brand" href="index.html">KING.EGY</a><a href="index.html" style="color:#fff">العودة للمتجر</a></header><section class="card"><h1>متابعة الشكاوى والاقتراحات</h1><p class="muted">هنا هتلاقي الرسائل اللي بعتها من نفس الموبايل والمتصفح، وحالتها ورد إدارة المتجر عليها.</p><button class="btn" id="refresh">تحديث الحالة</button><p id="notice" class="muted" aria-live="polite">جارٍ تحميل رسائلك...</p></section><section id="items"></section></main>
<script>
const API_URL='https://brrqmpnuoqatbmldqjcd.supabase.co/functions/v1/customer-orders',API_KEY='sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU';
let token=localStorage.getItem('kingegy_device_token');if(!token){token=crypto.randomUUID();localStorage.setItem('kingegy_device_token',token)}
const $=id=>document.getElementById(id),labels={new:'وصلتنا رسالتك',reviewed:'تمت مراجعة الرسالة',resolved:'تم حل المشكلة / تنفيذ الاقتراح'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(v){return new Date(v).toLocaleString('ar-EG')}
async function load(){ $('refresh').disabled=true;$('notice').textContent='جارٍ تحديث رسائلك...';try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':API_KEY,'Authorization':'Bearer '+API_KEY},body:JSON.stringify({action:'feedback_list',device_token:token})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');const rows=data.feedback||[];if(!rows.length){$('items').innerHTML='<section class="card"><h3>لا توجد شكاوى أو اقتراحات مرتبطة بهذا الجهاز حتى الآن.</h3><p class="muted">لما تبعت رسالة من صفحة المتجر هتظهر هنا تلقائيًا.</p><a href="index.html#feedback" style="color:#fff">إرسال اقتراح أو شكوى</a></section>';$('notice').textContent='';return}$('items').innerHTML=rows.map(f=>'<article class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2 style="margin:0">'+(f.feedback_type==='complaint'?'شكوى':'اقتراح')+'</h2><span class="tag">'+esc(labels[f.status]||f.status)+'</span></div><p class="muted">تاريخ الإرسال: '+date(f.created_at)+'</p><div class="entry"><b>رسالتك:</b><br>'+esc(f.message).replace(/\n/g,'<br>')+'</div>'+(f.admin_reply?'<div class="reply"><b>رد إدارة KING.EGY:</b><br>'+esc(f.admin_reply).replace(/\n/g,'<br>')+'</div>':'<p class="muted">لم يصل رد من الإدارة حتى الآن.</p>')+'</article>').join('');$('notice').textContent='تم تحديث رسائلك.';$('notice').className='success'}catch(e){$('notice').textContent='تعذر تحميل الرسائل حاليًا. حاول مرة أخرى.';$('notice').className='error'}finally{$('refresh').disabled=false}}
$('refresh').onclick=load;load();setInterval(()=>{if(document.visibilityState==='visible')load()},15000);
</script></body></html>
