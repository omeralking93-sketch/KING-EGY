const form=document.getElementById("f"), summary=document.getElementById("priceSummary");
function refreshTotal(){const qty=Number(form.elements.qty.value||1), gov=form.elements.gov.value, subtotal=600*qty, shipping=gov==="القاهرة"?50:0;summary.innerHTML="سعر المنتجات: "+subtotal+" جنيه<br>الشحن: "+(gov?(shipping+" جنيه"):"اختر المحافظة")+"<br><strong>الإجمالي: "+(subtotal+shipping)+" جنيه</strong>";}
