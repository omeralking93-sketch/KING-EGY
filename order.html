<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب KING.EGY</title><style>body{background:#080808;color:white;font:16px Arial;max-width:600px;margin:30px auto;padding:20px}form{background:#171717;padding:20px;border-radius:12px}label{display:block;margin:14px 0}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;box-sizing:border-box;background:#080808;color:white;border:1px solid #555;border-radius:7px}button{padding:14px;width:100%;font-weight:bold}</style><h1>KING.EGY - إتمام الطلب</h1><p id="productTitle">جارٍ تحميل المنتج...</p><form id="f"><label>الاسم<input name="name" required></label><label>رقم الموبايل<input name="phone" required></label><label>المحافظة<select name="gov" required>
<option value="">اختر المحافظة</option>
<option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>القليوبية</option><option>البحيرة</option><option>مطروح</option><option>دمياط</option><option>الدقهلية</option><option>كفر الشيخ</option><option>الغربية</option><option>المنوفية</option><option>الشرقية</option><option>الإسماعيلية</option><option>بورسعيد</option><option>السويس</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>بني سويف</option><option>الفيوم</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>البحر الأحمر</option><option>الوادي الجديد</option>
</select></label><label>المدينة<input name="city"></label><label>العنوان<textarea name="address" required></textarea></label><label>اللون<select name="color"><option value="Black">أسود</option><option value="White">أبيض</option></select></label><label>المقاس<select name="size"><option>M</option><option>L</option><option>XL</option><option>XXL</option></select></label><label>الكمية<select name="qty"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>ملاحظات<textarea name="notes"></textarea></label><div id="priceSummary" style="background:#080808;border:1px solid #555;border-radius:8px;padding:14px;line-height:2;margin:16px 0">سعر المنتجات: 600 جنيه<br>الشحن: اختر المحافظة<br><strong>الإجمالي: 600 جنيه</strong></div><button>تأكيد الطلب</button></form><p id="status"></p><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script><script>const db=window.supabase.createClient("https://brrqmpnuoqatbmldqjcd.supabase.co","sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU");
const form=document.getElementById("f"), summary=document.getElementById("priceSummary"), statusEl=document.getElementById("status");
const params=new URLSearchParams(location.search), productSlug=params.get("product")||"cotton-melton-wide-leg-shalwar";
let product=null, variants=[];
function refreshTotal(){const qty=Number(form.elements.qty.value||1), gov=form.elements.gov.value, subtotal=Number(product?.price_egp||0)*qty, shipping=gov==="القاهرة"?50:0;summary.innerHTML="سعر المنتجات: "+subtotal+" جنيه<br>الشحن: "+(gov?(shipping+" جنيه"):"اختر المحافظة")+"<br><strong>الإجمالي: "+(subtotal+shipping)+" جنيه</strong>";}
function updateSizes(){const color=form.elements.color.value;const rows=variants.filter(v=>v.color===color);form.elements.size.innerHTML=rows.map(v=>'<option value="'+v.size+'">'+v.size+'</option>').join('');}
async function init(){const {data:p,error}=await db.from("products").select("id,slug,name_ar,name_en,price_egp,is_active").eq("slug",productSlug).eq("is_active",true).maybeSingle();if(error||!p){statusEl.textContent="المنتج غير متاح حاليًا. ارجع للمتجر واختار منتجًا متاحًا.";form.querySelector("button").disabled=true;return}product=p;document.getElementById("productTitle").textContent=p.name_ar+" — "+Number(p.price_egp).toLocaleString("ar-EG")+" جنيه";
const v=await db.from("product_variants").select("color,size").eq("product_id",p.id).eq("is_active",true).order("color").order("size");if(v.error)throw v.error;variants=v.data||[];const colors=[...new Set(variants.map(x=>x.color))];form.elements.color.innerHTML=colors.map(x=>'<option value="'+x+'">'+(x==="Black"?"أسود":"أبيض")+'</option>').join('');if(!colors.length){statusEl.textContent="هذا المنتج غير متاح للطلب حاليًا.";form.querySelector("button").disabled=true;return}updateSizes();refreshTotal()}
form.elements.gov.addEventListener("change",refreshTotal);form.elements.qty.addEventListener("change",refreshTotal);form.elements.color.addEventListener("change",updateSizes);
init().catch(e=>{console.error(e);statusEl.textContent="تعذر تحميل تفاصيل المنتج. حاول مرة أخرى."});
form.onsubmit=async e=>{e.preventDefault();if(!product)return;const d=new FormData(form),b=form.querySelector("button");const colorSelect=form.querySelector('select[name="color"]'),sizeSelect=form.querySelector('select[name="size"]');const chosenColor=colorSelect.value,chosenSize=sizeSelect.value;if(!variants.some(v=>v.color===chosenColor&&v.size===chosenSize)){statusEl.textContent="من فضلك اختار لون ومقاس متاحين.";return}b.disabled=true;b.textContent="جارٍ تسجيل الطلب";try{let {data,error}=await db.rpc("submit_store_order",{p_customer_name:d.get("name"),p_phone:d.get("phone"),p_governorate:d.get("gov"),p_city:d.get("city"),p_address:d.get("address"),p_notes:d.get("notes"),p_product_slug:product.slug,p_color:chosenColor,p_size:chosenSize,p_quantity:Number(d.get("qty"))});if(error)throw error;let x=Array.isArray(data)?data[0]:data;if(!x?.order_number)throw Error("No order number");statusEl.textContent="تم تسجيل الطلب رقم "+x.order_number+" بالمقاس "+chosenSize+" بإجمالي "+x.total_egp+" جنيه. سيتم فتح واتساب.";let msg=encodeURIComponent("طلب KING.EGY رقم "+x.order_number+"\\n"+d.get("name")+"\\n"+d.get("phone")+"\\n"+d.get("gov")+" - "+d.get("city")+"\\n"+d.get("address")+"\\n"+product.name_ar+"\\n"+chosenColor+" / "+chosenSize+" / الكمية "+d.get("qty")+"\\nالإجمالي "+x.total_egp+" جنيه");form.reset();setTimeout(()=>location.href="https://wa.me/201228835350?text="+msg,1200)}catch(err){console.error(err);statusEl.textContent="تعذر تسجيل الطلب. لم يتم تأكيده؛ حاول مرة أخرى أو تواصل عبر واتساب.";b.disabled=false;b.textContent="تأكيد الطلب"}}
</script></html>
