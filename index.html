<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://brrqmpnuoqatbmldqjcd.supabase.co" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>KING.EGY | MEN'S WEAR</title>
<style>
:root{--bg:#080808;--panel:#151515;--text:#f5f5f5;--muted:#aaa;--line:#333;--accent:#fff;--hero-bg:#242424;--button-text:#080808;--card-radius:14px;--product-image-height:260px;--store-font:Arial}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--store-font),Tahoma,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;padding:12px 18px;border-radius:8px;background:var(--accent);color:var(--button-text);font-weight:700}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}.logo{font-size:27px;font-weight:900;letter-spacing:2px}.logo small{display:block;font-size:10px;letter-spacing:4px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px}.ghost{background:transparent;color:#fff;border:1px solid #555}.hero{padding:70px 6%;min-height:300px;background:linear-gradient(110deg,var(--bg),var(--hero-bg));display:flex;align-items:center}.hero h1{font-size:clamp(35px,7vw,66px);margin:0 0 12px}.hero p{color:var(--muted);font-size:20px}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.section-title{font-size:28px;margin:0 0 22px}.feedback-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.feedback-heading .section-title{margin:0 0 22px}.feedback-track-link{display:inline-block;text-decoration:none;padding:10px 16px;border-radius:8px;margin-bottom:22px;white-space:nowrap}.product-carousel{position:relative;max-width:560px;margin:0 auto;overflow:hidden;touch-action:pan-y;user-select:none}.product-track{display:flex;direction:ltr;transition:transform .32s ease;will-change:transform}.product-track.reverse{flex-direction:row-reverse}.product-slide{flex:0 0 100%;min-width:0}.carousel-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px}.carousel-controls button{min-width:46px;min-height:44px}.carousel-count{color:var(--muted);font-size:14px;min-width:54px;text-align:center}.product-slide img{user-select:none;-webkit-user-drag:none}@media(prefers-reduced-motion:reduce){.product-track{transition:none}}.card,.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden}.product-image-wrap{position:relative;display:block;overflow:hidden}.discount-badge{position:absolute;top:12px;right:12px;z-index:2;background:#d71920;color:#fff;font-weight:800;font-size:14px;line-height:1;padding:9px 12px;border-radius:7px;box-shadow:0 2px 8px #0006;direction:rtl}.product-art{height:var(--product-image-height);background:linear-gradient(135deg,#222,#050505);display:grid;place-items:center;color:var(--muted);font-size:22px}.info{padding:18px}.price{font-size:23px;font-weight:bold;margin:12px 0}.muted{color:var(--muted);line-height:1.7}.pill{display:inline-block;border:1px solid #555;border-radius:20px;padding:6px 12px;margin:4px}.footer{text-align:center;padding:35px;border-top:1px solid var(--line);color:var(--muted)}.panel{display:none;position:fixed;inset:0;background:#000d;z-index:10;overflow:auto;padding:18px}.panel-inner{max-width:850px;margin:25px auto;background:#111;border:1px solid #555;border-radius:14px;padding:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{background:#333;color:white}.tabs button.active{background:white;color:#000}.tab{display:none}.tab.active{display:block}.field{display:grid;gap:7px;margin:13px 0}.field input,.field select{background:#080808;color:#fff;border:1px solid #555;padding:12px;border-radius:7px;width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;border:1px solid #555;border-radius:8px;color:#ccc;margin:12px 0}@media(max-width:600px){.top{padding:13px 4%}.logo{font-size:21px}.hero{padding:45px 7%}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="logo" id="storeLogo">KING.EGY<small id="storeTagline">MEN'S WEAR</small></div><div class="actions"><a id="myOrdersLink" class="ghost" href="my-orders.html" style="display:inline-block;text-decoration:none;padding:12px 18px;border-radius:8px">طلباتي</a><button class="ghost" id="langBtn">English</button></div></header>
<section class="hero" id="storeHero"><div><h1 id="heroTitle" data-ar="راحتك أهم" data-en="YOUR COMFORT FIRST">راحتك أهم</h1><p id="heroText" data-ar="ملابس رجالي بتصميم مريح وشكل مميز." data-en="Men's wear designed for comfort and style.">ملابس رجالي بتصميم مريح وشكل مميز.</p><a href="#products"><button id="heroButton" data-ar="تسوق الآن" data-en="Shop now">تسوق الآن</button></a></div></section>
<main class="wrap" id="products"><h2 class="section-title"><a id="allProductsLink" href="catalog.html?lang=ar" data-ar="المنتجات" data-en="Products" style="color:inherit;text-decoration:none;border-bottom:1px solid #777;padding-bottom:5px">المنتجات</a></h2><div class="product-carousel" id="productGrid"><p class="muted">جارٍ تحميل المنتجات...</p></div></main>
<section class="wrap" id="contact"><h2 class="section-title" data-ar="تواصل معنا" data-en="Contact us">تواصل معنا</h2><div class="box" style="padding:22px;text-align:center"><p class="muted" data-ar="يسعدنا تواصلك معنا" data-en="We would love to hear from you">يسعدنا تواصلك معنا</p><div id="socialLinks" style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px"></div></div></section>
<section class="wrap" id="feedback"><div class="feedback-heading"><h2 class="section-title" data-ar="اقتراح أو شكوى" data-en="Suggestion or complaint">اقتراح أو شكوى</h2><a class="ghost feedback-track-link" href="feedback.html" data-ar="متابعة الشكاوى" data-en="Feedback status">متابعة الشكاوى</a></div><div class="box" style="padding:22px;max-width:700px"><p class="muted" data-ar="رأيك يهمنا. ابعتلنا اقتراحك أو شكواك وهتوصل مباشرة لإدارة المتجر." data-en="Your feedback matters. Send us a suggestion or complaint directly to store management.">رأيك يهمنا. ابعتلنا اقتراحك أو شكواك وهتوصل مباشرة لإدارة المتجر.</p><form id="feedbackForm"><label class="field"><span data-ar="نوع الرسالة" data-en="Message type">نوع الرسالة</span><select id="feedbackType" required style="width:100%;padding:12px;background:#080808;color:white;border:1px solid #555;border-radius:7px"><option value="suggestion">اقتراح</option><option value="complaint">شكوى</option></select></label><div class="row"><label class="field"><span data-ar="الاسم (اختياري)" data-en="Name (optional)">الاسم (اختياري)</span><input id="feedbackName" maxlength="100" style="width:100%;padding:12px;background:#080808;color:white;border:1px solid #555;border-radius:7px"></label><label class="field"><span data-ar="رقم الهاتف (اختياري)" data-en="Phone (optional)">رقم الهاتف (اختياري)</span><input id="feedbackPhone" type="tel" maxlength="30" style="width:100%;padding:12px;background:#080808;color:white;border:1px solid #555;border-radius:7px"></label></div><label class="field"><span data-ar="اكتب رسالتك" data-en="Your message">اكتب رسالتك</span><textarea id="feedbackMessage" required minlength="5" maxlength="3000" rows="5" style="width:100%;padding:12px;background:#080808;color:white;border:1px solid #555;border-radius:7px;resize:vertical"></textarea></label><button id="feedbackSubmit" type="submit" data-ar="إرسال" data-en="Send">إرسال</button><p id="feedbackStatus" class="muted" aria-live="polite"></p></form></div></section>
<footer class="footer">KING.EGY — <span data-ar="راحتك أهم" data-en="Your comfort first">راحتك أهم</span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let lang='ar';const $=id=>document.getElementById(id);
function applyLang(){document.documentElement.lang=lang;$('allProductsLink').href='catalog.html?lang='+lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=el.dataset[lang]);$('feedbackType').options[0].text=lang==='ar'?'اقتراح':'Suggestion';$('feedbackType').options[1].text=lang==='ar'?'شكوى':'Complaint';$('langBtn').textContent=lang==='ar'?'English':'العربية';renderMyOrdersLink()}
let storeProducts=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadStoreProducts(){const {data,error}=await db.from('products').select('id,slug,name_ar,name_en,description_ar,description_en,price_egp,discount_price_egp,image_url').eq('is_active',true).order('sort_order');if(error){$('productGrid').innerHTML='<p class="muted">تعذر تحميل المنتجات حاليًا.</p>';return}storeProducts=data||[];renderProducts()}
let activeProductIndex=0;
function renderProducts(){
 if(!storeProducts.length){$('productGrid').innerHTML='<p class="muted">لا توجد منتجات متاحة حاليًا.</p>';return}
 activeProductIndex=Math.min(activeProductIndex,storeProducts.length-1);
 const cards=storeProducts.map((p,index)=>{
  const name=lang==='ar'?p.name_ar:p.name_en,desc=lang==='ar'?(p.description_ar||''):(p.description_en||'');
  const oldPrice=Number(p.price_egp),salePrice=Number(p.discount_price_egp),hasDiscount=salePrice>0&&salePrice<oldPrice,discountPercent=hasDiscount?Math.round((oldPrice-salePrice)/oldPrice*100):0;
  const badge=hasDiscount?'<span class="discount-badge">'+(lang==='ar'?'خصم ':'')+discountPercent+'%'+(lang==='en'?' OFF':'')+'</span>':'';
  const img=p.image_url?'<div class="product-image-wrap">'+badge+'<img loading="'+(index===0?'eager':'lazy')+'" fetchpriority="'+(index===0?'high':'auto')+'" decoding="async" src="'+esc(p.image_url)+'" alt="'+esc(name)+'" style="width:100%;height:var(--product-image-height);object-fit:cover"></div>':'<div class="product-image-wrap">'+badge+'<div class="product-art">KING.EGY</div></div>';
  return '<article class="card product-slide"><a href="product.html?product='+encodeURIComponent(p.slug)+'&lang='+lang+'" style="display:block;color:inherit;text-decoration:none">'+img+'<div class="info"><h3>'+esc(name)+'</h3><p class="muted">'+esc(desc)+'</p><div class="price">'+(hasDiscount?'<s style="font-size:.75em;color:#999;font-weight:400">'+oldPrice.toLocaleString(lang==='ar'?'ar-EG':'en-US')+' '+(lang==='ar'?'جنيه':'EGP')+'</s><br><strong>'+salePrice.toLocaleString(lang==='ar'?'ar-EG':'en-US')+' '+(lang==='ar'?'جنيه':'EGP')+'</strong>':oldPrice.toLocaleString(lang==='ar'?'ar-EG':'en-US')+' '+(lang==='ar'?'جنيه':'EGP'))+'</div><span class="muted">'+(lang==='ar'?'عرض التفاصيل والصور ←':'View details & photos →')+'</span></div></a><div class="info" style="padding-top:0"><a href="order.html?product='+encodeURIComponent(p.slug)+'&lang='+lang+'" style="text-decoration:none"><button>'+(lang==='ar'?'إتمام الطلب':'Checkout')+'</button></a> <button class="ghost whatsapp-product" type="button" data-slug="'+esc(p.slug)+'">'+(lang==='ar'?'اطلب عبر واتساب':'Order on WhatsApp')+'</button></div></article>';
 }).join('');
 $('productGrid').innerHTML='<div class="product-track '+(lang==='en'?'reverse':'')+'" id="productTrack">'+cards+'</div>'+(storeProducts.length>1?'<div class="carousel-controls"><button type="button" class="ghost" id="productPrev" aria-label="'+(lang==='ar'?'المنتج السابق':'Previous product')+'">‹</button><span class="carousel-count" id="productCount" aria-live="polite"></span><button type="button" class="ghost" id="productNext" aria-label="'+(lang==='ar'?'المنتج التالي':'Next product')+'">›</button></div>':'');
 updateProductCarousel();
 const prev=$('productPrev'),next=$('productNext');
 if(prev)prev.addEventListener('click',()=>moveProduct(-1));
 if(next)next.addEventListener('click',()=>moveProduct(1));
 let startX=0,startY=0;
 const carousel=$('productGrid');
 carousel.addEventListener('click',e=>{const b=e.target.closest('.whatsapp-product');if(b)orderWhatsApp(b.dataset.slug)});
 carousel.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;startX=e.clientX;startY=e.clientY;});
 carousel.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy))return;const nextGesture=lang==='ar'?dx<0:dx>0;moveProduct(nextGesture?1:-1);});
 carousel.addEventListener('pointercancel',()=>{startX=0;startY=0});
}
function updateProductCarousel(){
 const track=$('productTrack');if(!track)return;
 const sign=lang==='ar'?-1:1;
 track.style.transform='translateX('+(sign*activeProductIndex*100)+'%)';
 const count=$('productCount');if(count)count.textContent=(activeProductIndex+1)+' / '+storeProducts.length;
 const prev=$('productPrev'),next=$('productNext');
 if(prev)prev.disabled=activeProductIndex===0;
 if(next)next.disabled=activeProductIndex===storeProducts.length-1;
}
function moveProduct(step){activeProductIndex=Math.max(0,Math.min(storeProducts.length-1,activeProductIndex+step));updateProductCarousel();}

let storeDesign={};
function applyStoreDesign(s){
 storeDesign=s||{};
 const root=document.documentElement;
 const vars={bg:'--bg',panel:'--panel',text:'--text',muted:'--muted',accent:'--accent',hero_bg:'--hero-bg',button_text:'--button-text',card_radius:'--card-radius',product_image_height:'--product-image-height',font:'--store-font'};
 Object.entries(vars).forEach(([k,v])=>{if(storeDesign[k])root.style.setProperty(v,(k==='card_radius'||k==='product_image_height')?storeDesign[k]+'px':storeDesign[k])});
 if(storeDesign.logo)$('storeLogo').childNodes[0].textContent=storeDesign.logo;
 if(storeDesign.tagline)$('storeTagline').textContent=storeDesign.tagline;
 $('heroTitle').dataset.ar=storeDesign.hero_title_ar||'راحتك أهم';$('heroTitle').dataset.en=storeDesign.hero_title_en||'YOUR COMFORT FIRST';
 $('heroText').dataset.ar=storeDesign.hero_text_ar||'';$('heroText').dataset.en=storeDesign.hero_text_en||'';
 $('heroButton').dataset.ar=storeDesign.hero_button_ar||'تسوق الآن';$('heroButton').dataset.en=storeDesign.hero_button_en||'Shop now';
 if(storeDesign.hero_image)$('storeHero').style.backgroundImage='linear-gradient(90deg,#000b,#0005),url("'+storeDesign.hero_image.replace(/"/g,'')+'")';
 renderSocialLinks();
 applyLang();
 renderMyOrdersLink();
}
async function loadStoreDesign(){const {data,error}=await db.from('store_settings').select('settings').eq('id',1).maybeSingle();if(!error&&data?.settings)applyStoreDesign(data.settings)}
function renderMyOrdersLink(){const enabled=storeDesign.my_orders_enabled!==false;$('myOrdersLink').hidden=!enabled;$('myOrdersLink').textContent=storeDesign[lang==='ar'?'my_orders_text_ar':'my_orders_text_en']||(lang==='ar'?'طلباتي':'My orders')}
function renderSocialLinks(){const items=[['facebook_url','Facebook','<svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8z"/></svg>'],['phone','اتصال','<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>'],['instagram_url','Instagram','<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>'],['tiktok_url','TikTok','<svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor" aria-hidden="true"><path d="M16.6 3c.3 2 1.4 3.4 3.4 3.6v3.1a8 8 0 0 1-3.4-.9v6.1a6 6 0 1 1-6-6c.4 0 .8 0 1.2.1v3.2a3 3 0 1 0 1.7 2.7V3z"/></svg>'],['telegram_url','Telegram','<svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor" aria-hidden="true"><path d="m21.7 4.4-3.2 15.1c-.2 1.1-.8 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.8-8c.4-.3-.1-.5-.6-.2L6.4 13.4l-4.6-1.4c-1-.3-1-1 .2-1.5L20 3.2c.9-.3 1.9.2 1.7 1.2z"/></svg>']];$('socialLinks').innerHTML=items.filter(x=>(x[0]==='phone'?Boolean(String(storeDesign.phone_number||'').replace(/[^0-9]/g,'')):(storeDesign[x[0]]&&/^https:\/\//i.test(storeDesign[x[0]])))).map(x=>'<a href="'+(x[0]==='phone'?'tel:'+String(storeDesign.phone_number||'').replace(/[^+0-9]/g,''):esc(storeDesign[x[0]]))+'" '+(x[0]==='phone'?'':'target="_blank" rel="noopener noreferrer" ')+'aria-label="'+x[1]+'" title="'+x[1]+'" style="width:48px;height:48px;border:1px solid #666;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:inherit">'+x[2]+'</a>').join('')}
$('feedbackForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('feedbackSubmit'),status=$('feedbackStatus'),message=$('feedbackMessage').value.trim();if(message.length<5){status.textContent=lang==='ar'?'اكتب رسالة لا تقل عن 5 أحرف.':'Please enter at least 5 characters.';return}btn.disabled=true;status.textContent=lang==='ar'?'جارٍ الإرسال...':'Sending...';let deviceToken=localStorage.getItem('kingegy_device_token');if(!deviceToken){deviceToken=crypto.randomUUID();localStorage.setItem('kingegy_device_token',deviceToken)}const {error}=await db.from('customer_feedback').insert({feedback_type:$('feedbackType').value,customer_name:$('feedbackName').value.trim()||null,customer_phone:$('feedbackPhone').value.trim()||null,message,device_token:deviceToken});btn.disabled=false;if(error){status.textContent=lang==='ar'?'تعذر إرسال الرسالة حاليًا. حاول مرة أخرى.':'Could not send your message. Please try again.';return}e.target.reset();status.innerHTML=lang==='ar'?'وصلتنا رسالتك بنجاح، تقدر تتابع حالتها وتشوف ردنا من <a href="feedback.html" style="color:inherit;text-decoration:underline">متابعة الشكاوى والاقتراحات</a>.':'Your message was sent. Track its status and our reply <a href="feedback.html" style="color:inherit;text-decoration:underline">here</a>.'});
function orderWhatsApp(slug){const p=storeProducts.find(x=>x.slug===slug);if(!p)return;const name=lang==='ar'?p.name_ar:p.name_en;location.href='https://wa.me/201228835350?text='+encodeURIComponent((lang==='ar'?'أهلاً، أريد طلب ':'Hello, I want to order ')+name+' — '+(Number(p.discount_price_egp)>0&&Number(p.discount_price_egp)<Number(p.price_egp)?p.discount_price_egp:p.price_egp)+' EGP')}
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';applyLang();renderProducts()};
const db=window.supabase.createClient('https://brrqmpnuoqatbmldqjcd.supabase.co','sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU');
loadStoreDesign();loadStoreProducts();
const prefetchedPages=new Set();
function warmPage(a){const u=a&&a.getAttribute('href');if(!u||u[0]==='#'||u.startsWith('tel:')||u.startsWith('https:'))return;let t;try{t=new URL(u,location.href)}catch(e){return}if(t.origin!==location.origin||!t.pathname.endsWith('.html')||prefetchedPages.has(t.href))return;prefetchedPages.add(t.href);const l=document.createElement('link');l.rel='prefetch';l.href=t.href;document.head.appendChild(l)}
document.addEventListener('pointerover',e=>warmPage(e.target.closest('a')),{passive:true});
document.addEventListener('focusin',e=>warmPage(e.target.closest('a')));
document.addEventListener('touchstart',e=>warmPage(e.target.closest('a')),{passive:true});









</script></body></html>
