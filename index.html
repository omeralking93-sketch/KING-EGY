<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KING.EGY | MEN'S WEAR</title>
<style>
:root{--bg:#080808;--panel:#151515;--text:#f5f5f5;--muted:#aaa;--line:#333;--accent:#fff;--hero-bg:#242424;--button-text:#080808;--card-radius:14px;--product-image-height:260px;--store-font:Arial}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--store-font),Tahoma,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;padding:12px 18px;border-radius:8px;background:var(--accent);color:var(--button-text);font-weight:700}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}.logo{font-size:27px;font-weight:900;letter-spacing:2px}.logo small{display:block;font-size:10px;letter-spacing:4px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px}.ghost{background:transparent;color:#fff;border:1px solid #555}.hero{padding:70px 6%;min-height:300px;background:linear-gradient(110deg,var(--bg),var(--hero-bg));display:flex;align-items:center}.hero h1{font-size:clamp(35px,7vw,66px);margin:0 0 12px}.hero p{color:var(--muted);font-size:20px}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.section-title{font-size:28px;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card,.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden}.product-art{height:var(--product-image-height);background:linear-gradient(135deg,#222,#050505);display:grid;place-items:center;color:var(--muted);font-size:22px}.info{padding:18px}.price{font-size:23px;font-weight:bold;margin:12px 0}.muted{color:var(--muted);line-height:1.7}.pill{display:inline-block;border:1px solid #555;border-radius:20px;padding:6px 12px;margin:4px}.footer{text-align:center;padding:35px;border-top:1px solid var(--line);color:var(--muted)}.panel{display:none;position:fixed;inset:0;background:#000d;z-index:10;overflow:auto;padding:18px}.panel-inner{max-width:850px;margin:25px auto;background:#111;border:1px solid #555;border-radius:14px;padding:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{background:#333;color:white}.tabs button.active{background:white;color:#000}.tab{display:none}.tab.active{display:block}.field{display:grid;gap:7px;margin:13px 0}.field input,.field select{background:#080808;color:#fff;border:1px solid #555;padding:12px;border-radius:7px;width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{padding:12px;border:1px solid #555;border-radius:8px;color:#ccc;margin:12px 0}@media(max-width:600px){.top{padding:13px 4%}.logo{font-size:21px}.hero{padding:45px 7%}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="logo" id="storeLogo">KING.EGY<small id="storeTagline">MEN'S WEAR</small></div><div class="actions"><button class="ghost" id="langBtn">English</button></div></header>
<section class="hero" id="storeHero"><div><h1 id="heroTitle" data-ar="راحتك أهم" data-en="YOUR COMFORT FIRST">راحتك أهم</h1><p id="heroText" data-ar="ملابس رجالي بتصميم مريح وشكل مميز." data-en="Men's wear designed for comfort and style.">ملابس رجالي بتصميم مريح وشكل مميز.</p><a href="#products"><button id="heroButton" data-ar="تسوق الآن" data-en="Shop now">تسوق الآن</button></a></div></section>
<main class="wrap" id="products"><h2 class="section-title" data-ar="المنتجات" data-en="Products">المنتجات</h2><div class="grid" id="productGrid"><p class="muted">جارٍ تحميل المنتجات...</p></div></main>
<footer class="footer">KING.EGY — <span data-ar="راحتك أهم" data-en="Your comfort first">راحتك أهم</span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let lang='ar';const $=id=>document.getElementById(id);
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=el.dataset[lang]);$('langBtn').textContent=lang==='ar'?'English':'العربية'}
let storeProducts=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadStoreProducts(){const {data,error}=await db.from('products').select('id,slug,name_ar,name_en,description_ar,description_en,price_egp,image_url').eq('is_active',true).order('sort_order');if(error){$('productGrid').innerHTML='<p class="muted">تعذر تحميل المنتجات حاليًا.</p>';return}storeProducts=data||[];renderProducts()}
function renderProducts(){if(!storeProducts.length){$('productGrid').innerHTML='<p class="muted">لا توجد منتجات متاحة حاليًا.</p>';return}$('productGrid').innerHTML=storeProducts.map(p=>{const name=lang==='ar'?p.name_ar:p.name_en,desc=lang==='ar'?(p.description_ar||''): (p.description_en||'');const img=p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(name)+'" style="width:100%;height:var(--product-image-height);object-fit:cover">':'<div class="product-art">KING.EGY</div>';return '<article class="card"><a href="product.html?product='+encodeURIComponent(p.slug)+'&lang='+lang+'" style="display:block;color:inherit;text-decoration:none">'+img+'<div class="info"><h3>'+esc(name)+'</h3><p class="muted">'+esc(desc)+'</p><div class="price">'+Number(p.price_egp).toLocaleString(lang==='ar'?'ar-EG':'en-US')+' '+(lang==='ar'?'جنيه':'EGP')+'</div><span class="muted">'+(lang==='ar'?'عرض التفاصيل والصور ←':'View details & photos →')+'</span></div></a><div class="info" style="padding-top:0"><a href="order.html?product='+encodeURIComponent(p.slug)+'&lang='+lang+'" style="text-decoration:none"><button>'+(lang==='ar'?'إتمام الطلب':'Checkout')+'</button></a><button class="ghost" onclick="orderWhatsApp(\''+esc(p.slug)+'\')">'+(lang==='ar'?'اطلب عبر واتساب':'Order on WhatsApp')+'</button></div></article>'}).join('')}

let storeDesign={};
function applyStoreDesign(s){
 storeDesign=s||{};
 const root=document.documentElement;
 const vars={bg:'--bg',panel:'--panel',text:'--text',muted:'--muted',accent:'--accent',hero_bg:'--hero-bg',button_text:'--button-text',card_radius:'--card-radius',product_image_height:'--product-image-height',font:'--store-font'};
 Object.entries(vars).forEach(([k,v])=>{if(storeDesign[k])root.style.setProperty(v,(k==='card_radius'||k==='product_image_height')?storeDesign[k]+'px':storeDesign[k])});
 if(storeDesign.logo)$('storeLogo').childNodes[0].textContent=storeDesign.logo;
 if(storeDesign.tagline)$('storeTagline').textContent=storeDesign.tagline;
 $('heroTitle').dataset.ar=storeDesign.hero_title_ar||'راحتك أهم';$('heroTitle').dataset.en=storeDesign.hero_title_en||'YOUR COMFORT FIRST';
 $('heroText').dataset.ar=storeDesign.hero_text_ar||'';$('heroText').dataset.en=storeDesign.hero_text_en||'';
 $('heroButton').dataset.ar=storeDesign.hero_button_ar||'تسوق الآن';$('heroButton').dataset.en=storeDesign.hero_button_en||'Shop now';
 if(storeDesign.hero_image)$('storeHero').style.backgroundImage='linear-gradient(90deg,#000b,#0005),url("'+storeDesign.hero_image.replace(/"/g,'')+'")';
 applyLang();
}
async function loadStoreDesign(){const {data,error}=await db.from('store_settings').select('settings').eq('id',1).maybeSingle();if(!error&&data?.settings)applyStoreDesign(data.settings)}
function orderWhatsApp(slug){const p=storeProducts.find(x=>x.slug===slug);if(!p)return;const name=lang==='ar'?p.name_ar:p.name_en;location.href='https://wa.me/201228835350?text='+encodeURIComponent((lang==='ar'?'أهلاً، أريد طلب ':'Hello, I want to order ')+name+' — '+p.price_egp+' EGP')}
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';applyLang();renderProducts()};
const db=window.supabase.createClient('https://brrqmpnuoqatbmldqjcd.supabase.co','sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU');
loadStoreDesign();loadStoreProducts();









</script></body></html>
