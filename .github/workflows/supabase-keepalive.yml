name: Supabase keep-alive

on:
  schedule:
    # Three checks per day to generate real read-only database activity.
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Supabase products table
        env:
          SUPABASE_URL: https://brrqmpnuoqatbmldqjcd.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 5 --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1&ping=$(date +%s)" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Cache-Control: no-cache"
      - name: Check Supabase store settings table
        env:
          SUPABASE_URL: https://brrqmpnuoqatbmldqjcd.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 5 --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/store_settings?select=id&limit=1&ping=$(date +%s)" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Cache-Control: no-cache"
