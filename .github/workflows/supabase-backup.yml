name: Encrypted Supabase backup

on:
  schedule:
    - cron: "30 2 1 * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-backup.yml"

permissions:
  contents: write

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_URL: https://brrqmpnuoqatbmldqjcd.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL secret"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Missing BACKUP_PASSPHRASE secret"; exit 1; }
          test "${#BACKUP_PASSPHRASE}" -ge 24 || { echo "BACKUP_PASSPHRASE must be at least 24 characters"; exit 1; }

      - name: Parse connection settings without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const u = new URL(process.env.SUPABASE_DB_URL);
          if (!['postgres:', 'postgresql:'].includes(u.protocol)) throw new Error('SUPABASE_DB_URL must be a PostgreSQL URL');
          const values = {
            PGHOST: u.hostname,
            PGPORT: u.port || '5432',
            PGDATABASE: decodeURIComponent(u.pathname.replace(/^\\//, '')),
            PGUSER: decodeURIComponent(u.username),
            PGPASSWORD: decodeURIComponent(u.password),
            PGSSLMODE: 'require'
          };
          if (!values.PGHOST || !values.PGDATABASE || !values.PGUSER || !values.PGPASSWORD) throw new Error('Database URL is missing a required component');
          for (const [key, value] of Object.entries(values)) {
            fs.appendFileSync(process.env.GITHUB_ENV, key + '=' + value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A') + '\\n');
          }
          console.log('Connection host:', values.PGHOST);
          console.log('Connection port:', values.PGPORT);
          console.log('Connection user:', values.PGUSER);
          console.log('Connection database:', values.PGDATABASE);
          NODE

      - name: Verify database authentication and dump application schema/data
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres:17
          docker run --rm -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE postgres:17 \
            psql -X -v ON_ERROR_STOP=1 -Atc "select current_user || ' @ ' || current_database()"
          # The KING.EGY application tables live in public. Supabase-managed auth/storage
          # schemas are intentionally excluded; Storage objects are archived separately.
          docker run --rm -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE postgres:17 \
            pg_dump --schema=public --schema-only --no-owner --no-privileges > schema.sql
          docker run --rm -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE postgres:17 \
            pg_dump --schema=public --data-only --no-owner --no-privileges --no-comments > data.sql
          printf '%s\\n' '-- Supabase-managed roles are provisioned by Supabase; no pg_dumpall roles export is used.' > roles.sql
          test -s schema.sql
          test -s data.sql

      - name: Back up product image files
        run: node .github/scripts/backup-images.mjs

      - name: Package and encrypt backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-output
          tar -czf backup-output/king-egy-backup.tar.gz roles.sql schema.sql data.sql backup-images
          gpg --batch --yes --pinentry-mode loopback \\
            --passphrase "$BACKUP_PASSPHRASE" \\
            --symmetric --cipher-algo AES256 \\
            --output backup-output/king-egy-backup.tar.gz.gpg \\
            backup-output/king-egy-backup.tar.gz
          rm -f backup-output/king-egy-backup.tar.gz roles.sql schema.sql data.sql
          rm -rf backup-images

      - name: Publish encrypted backup as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="supabase-backup-$(date -u +%Y%m%d)-run${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" backup-output/king-egy-backup.tar.gz.gpg \\
            --repo "$GITHUB_REPOSITORY" \\
            --title "Encrypted KING.EGY backup $(date -u +%Y-%m-%d)" \\
            --notes "Encrypted AES-256 backup. Contains public application schema/data and referenced product image files. Supabase-managed roles are provisioned by Supabase. Decryption requires the private BACKUP_PASSPHRASE secret. Do not publish or share the passphrase."
