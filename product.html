<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفاصيل المنتج | KING.EGY</title>
<style>
:root{--bg:#080808;--panel:#151515;--text:#f5f5f5;--muted:#aaa;--line:#333;--accent:#fff;--button-text:#080808;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,Tahoma,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 5%;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:900;letter-spacing:2px}.btn,button{display:inline-block;padding:12px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--button-text);font-weight:bold;text-decoration:none;cursor:pointer}.secondary{background:#222;color:#fff;border:1px solid #555}.wrap{max-width:1100px;margin:30px auto;padding:16px}.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:30px}.gallery,.details{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.main-image{width:100%;height:var(--gallery-height,470px);object-fit:var(--image-fit,contain);background:#080808;border-radius:10px}.thumbs{display:flex;gap:9px;overflow-x:auto;margin-top:12px}.thumb{width:var(--thumb-size,78px);height:var(--thumb-size,78px);flex:0 0 var(--thumb-size,78px);object-fit:cover;border:2px solid transparent;border-radius:8px;cursor:pointer}.thumb.active{border-color:#fff}.price{font-size:28px;font-weight:bold;margin:18px 0}.desc{white-space:pre-line;color:var(--muted);line-height:1.9}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 14px;border:1px solid #555;border-radius:30px;background:#222;color:#fff}.chip.active{background:#fff;color:#000}.muted{color:var(--muted);line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.actions>*{flex:1;text-align:center}.error{color:#ff9999}@media(max-width:750px){.layout{grid-template-columns:1fr}.main-image{height:360px}.wrap{margin:12px auto}.details h1{font-size:25px}}
</style></head>
<body>
<header class="top"><a href="index.html" class="brand" style="color:inherit;text-decoration:none">KING.EGY</a><div><button class="secondary" id="langBtn">English</button></div></header>
<main class="wrap"><p><a href="index.html" class="muted" style="text-decoration:none" id="backLink">← العودة للمتجر</a></p>
<div id="loading" class="muted">جارٍ تحميل تفاصيل المنتج...</div>
<section id="product" class="layout" hidden>
<div class="gallery"><img id="mainImage" class="main-image" alt=""><div id="thumbs" class="thumbs"></div></div>
<div class="details"><h1 id="name"></h1><div class="price" id="price"></div><p class="desc" id="description"></p>
<h3 id="colorLabel">اللون المتاح</h3><div class="chips" id="colors"></div>
<h3 id="sizeLabel">المقاسات المتاحة</h3><div class="chips" id="sizes"></div>
<p class="muted" id="availability"></p><div class="actions"><a id="orderBtn" class="btn" href="#">اطلب الآن</a><a id="whatsappBtn" class="btn secondary" href="#" target="_blank" rel="noopener">اطلب عبر واتساب</a></div></div>
</section><p id="error" class="error"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://brrqmpnuoqatbmldqjcd.supabase.co','sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU');
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),slug=params.get('product'),lang=params.get('lang')==='en'?'en':'ar';
let pageSettings={};
let product=null,images=[],variants=[],productColors=[],colorNameMap={},selectedColor='',selectedSize='';
const words={ar:{back:'← العودة للمتجر',loading:'جارٍ تحميل تفاصيل المنتج...',color:'اللون المتاح',size:'المقاسات المتاحة',order:'اطلب الآن',wa:'اطلب عبر واتساب',pound:'جنيه',available:'متاح للطلب',none:'المنتج غير متاح حاليًا.',noImage:'لا توجد صور لهذا المنتج بعد.',black:'أسود',gray:'رصاصي'},en:{back:'← Back to store',loading:'Loading product details...',color:'Available colors',size:'Available sizes',order:'Order now',wa:'Order on WhatsApp',pound:'EGP',available:'Available to order',none:'This product is currently unavailable.',noImage:'No product photos yet.',black:'Black',gray:'Gray'}};
function applyPageSettings(){const s=pageSettings||{};document.documentElement.style.setProperty('--gallery-height',(Number(s.product_gallery_height)||470)+'px');document.documentElement.style.setProperty('--thumb-size',(Number(s.product_thumb_size)||78)+'px');document.documentElement.style.setProperty('--image-fit',s.product_image_fit==='cover'?'cover':'contain');$('description').hidden=s.product_show_description===false;$('thumbs').hidden=s.product_show_gallery_thumbs===false;$('colorLabel').hidden=$('colors').hidden=s.product_show_colors===false;$('sizeLabel').hidden=$('sizes').hidden=s.product_show_sizes===false;$('whatsappBtn').hidden=s.product_show_whatsapp===false;}
function setLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('langBtn').textContent=lang==='ar'?'English':'العربية';$('backLink').textContent=words[lang].back;$('colorLabel').textContent=words[lang].color;$('sizeLabel').textContent=words[lang].size;$('orderBtn').textContent=pageSettings[lang==='ar'?'product_order_text_ar':'product_order_text_en']||words[lang].order;$('whatsappBtn').textContent=pageSettings[lang==='ar'?'product_whatsapp_text_ar':'product_whatsapp_text_en']||words[lang].wa;if(product)renderProduct()}
function renderProduct(){const w=words[lang];$('name').textContent=lang==='ar'?product.name_ar:product.name_en;$('description').textContent=lang==='ar'?(product.description_ar||''):(product.description_en||'');$('price').textContent=Number(product.price_egp).toLocaleString(lang==='ar'?'ar-EG':'en-US')+' '+w.pound;$('availability').textContent=w.available;
const colorImages=images.filter(x=>x.color===selectedColor).map(x=>x.image_url);const galleryImages=colorImages.length?colorImages:(images.length===1&&!images[0].color?[images[0].image_url]:[]);$('mainImage').src=galleryImages[0]||'';$('mainImage').style.display=galleryImages.length?'block':'none';$('thumbs').innerHTML=galleryImages.map((src,i)=>'<img class="thumb '+(i===0?'active':'')+'" src="'+src.replace(/"/g,'&quot;')+'" data-index="'+i+'" alt="Product photo">').join('');document.querySelectorAll('.thumb').forEach(t=>t.onclick=()=>{ $('mainImage').src=galleryImages[Number(t.dataset.index)];document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));t.classList.add('active')});if(!galleryImages.length){$('mainImage').style.display='none';$('thumbs').innerHTML='<span class="muted">'+(lang==='ar'?'لا توجد صور مضافة لهذا اللون بعد.':'No photos added for this color yet.')+'</span>'}
const colorSet=[...new Set(variants.map(v=>v.color))].sort((a,b)=>(productColors.find(x=>x.color_code===a)?.sort_order??999)-(productColors.find(x=>x.color_code===b)?.sort_order??999));$('colors').innerHTML=colorSet.map(c=>'<button class="chip '+(selectedColor===c?'active':'')+'" data-color="'+c+'">'+(lang==='ar'?(colorNameMap[c]?.name_ar||c):(colorNameMap[c]?.name_en||c))+'</button>').join('');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{selectedColor=b.dataset.color;selectedSize='';renderProduct()});
const sizes=variants.filter(v=>v.color===selectedColor).map(v=>v.size).sort((a,b)=>['M','L','XL','XXL'].indexOf(a)-['M','L','XL','XXL'].indexOf(b));if(!sizes.includes(selectedSize))selectedSize=sizes.includes('M')?'M':(sizes[0]||'');$('sizes').innerHTML=sizes.map(s=>'<button class="chip '+(selectedSize===s?'active':'')+'" data-size="'+s+'">'+s+'</button>').join('');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{selectedSize=b.dataset.size;renderProduct()});
const q='product='+encodeURIComponent(product.slug)+'&lang='+lang+ (selectedColor?'&color='+encodeURIComponent(selectedColor):'')+(selectedSize?'&size='+encodeURIComponent(selectedSize):'');$('orderBtn').href='order.html?product='+encodeURIComponent(product.slug)+'&lang='+lang+(selectedColor?'&color='+encodeURIComponent(selectedColor):'')+(selectedSize?'&size='+encodeURIComponent(selectedSize):'');
const text=(lang==='ar'?'أهلاً، أريد طلب ':'Hello, I want to order ')+(lang==='ar'?product.name_ar:product.name_en)+' — '+product.price_egp+' EGP'+(selectedColor?' / '+selectedColor:'')+(selectedSize?' / '+selectedSize:'');$('whatsappBtn').href='https://wa.me/201228835350?text='+encodeURIComponent(text)}
async function init(){const {data:settingsData}=await db.from('store_settings').select('settings').eq('id',1).maybeSingle();pageSettings=settingsData?.settings||{};applyPageSettings();setLang();if(!slug)throw Error(words[lang].none);const {data:p,error}=await db.from('products').select('*').eq('slug',slug).eq('is_active',true).maybeSingle();if(error||!p)throw Error(words[lang].none);product=p;const [im,v,colorsResult]=await Promise.all([db.from('product_images').select('image_url,sort_order,color').eq('product_id',p.id).order('sort_order').order('created_at'),db.from('product_variants').select('color,size').eq('product_id',p.id).eq('is_active',true),db.from('product_colors').select('color_code,name_ar,name_en,sort_order').eq('product_id',p.id).eq('is_active',true).order('sort_order')]);if(im.error)throw im.error;if(v.error)throw v.error;if(colorsResult.error)throw colorsResult.error;images=im.data||[];if(!images.length&&p.image_url)images=[{image_url:p.image_url,color:'gray'}];variants=v.data||[];productColors=colorsResult.data||[{color_code:'gray',name_ar:'رصاصي',name_en:'Gray',sort_order:0},{color_code:'black',name_ar:'أسود',name_en:'Black',sort_order:1}];colorNameMap=Object.fromEntries(productColors.map(c=>[c.color_code,c]));applyPageSettings();selectedColor=variants.some(x=>x.color==='gray')?'gray':(variants[0]?.color||'');$('loading').hidden=true;$('product').hidden=false;renderProduct()}
$('langBtn').onclick=()=>{location.href='product.html?product='+encodeURIComponent(slug||'')+'&lang='+(lang==='ar'?'en':'ar')};
init().catch(e=>{$('loading').hidden=true;$('error').textContent=e.message||words[lang].none});
</script></body></html>
