<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>إدارة مصاريف الشحن - KING.EGY</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font:16px Arial,Tahoma,sans-serif}.wrap{max-width:1000px;margin:30px auto;padding:18px}.brand{font-size:28px;font-weight:900;letter-spacing:2px}.muted{color:#aaa;line-height:1.7}.box,.panel{background:#171717;border:1px solid #333;border-radius:13px;padding:18px;margin:16px 0}.box{max-width:460px;margin:35px auto}input,button{font:inherit;padding:13px;border-radius:8px;width:100%;margin:7px 0}input{background:#080808;color:#fff;border:1px solid #555}button{border:0;background:#fff;color:#000;font-weight:bold;cursor:pointer}.secondary{background:#333;color:#fff}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.fee{background:#222;padding:12px;border-radius:9px}.fee input{margin-bottom:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row a{display:inline-block;background:#333;color:#fff;padding:12px 16px;border-radius:8px;text-decoration:none}.error{color:#ff9b9b}.success{color:#a8e6b0}</style></head><body><main class="wrap"><div class="brand">KING.EGY <span style="font-size:11px;letter-spacing:3px;color:#aaa">MEN'S WEAR</span></div><section id="login" class="box"><h2>تسجيل دخول الإدارة</h2><p class="muted">سجّل الدخول ببريد الإدارة وكلمة المرور.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button>دخول</button></form><p id="loginMsg" class="muted"></p><a href="admin.html" style="color:white">العودة للوحة الطلبات</a></section><section id="dashboard" class="hidden"><div class="row"><h1 style="flex:1">إدارة مصاريف الشحن</h1><button id="logout" class="secondary" style="width:auto">تسجيل خروج</button></div><p class="muted">حدد تكلفة الشحن لكل محافظة بالجنيه، ثم اضغط حفظ. السعر سيظهر تلقائيًا للعميل عند اختيار المحافظة.</p><div class="panel"><div id="shippingRates" class="grid">جارٍ تحميل المحافظات...</div><button id="saveShipping" style="max-width:260px;margin-top:18px">حفظ مصاريف الشحن</button><p id="shippingMsg" class="muted"></p></div><div class="row"><a href="admin.html">إدارة الطلبات</a><a href="products.html">إدارة المنتجات والتصميم</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://brrqmpnuoqatbmldqjcd.supabase.co','sb_publishable_3mccs5kj2dXwuUjcUp2Lzw_wQO62kqU');
const $=id=>document.getElementById(id);
const governorates=['القاهرة','الجيزة','الإسكندرية','القليوبية','البحيرة','مطروح','دمياط','الدقهلية','كفر الشيخ','الغربية','المنوفية','الشرقية','الإسماعيلية','بورسعيد','السويس','شمال سيناء','جنوب سيناء','بني سويف','الفيوم','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginForm').onsubmit=async e=>{e.preventDefault();if($('email').value.trim().toLowerCase()!=='alkingo651@gmail.com'){$('loginMsg').textContent='هذا البريد غير مصرح له بالدخول.';return}$('loginMsg').textContent='جارٍ تسجيل الدخول...';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='تعذر تسجيل الدخول: '+error.message;$('loginMsg').className='error';return}await showDashboard()};
async function showDashboard(){const {data:{user}}=await db.auth.getUser();if(!user||user.email?.toLowerCase()!=='alkingo651@gmail.com'){await db.auth.signOut();return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadRates()}
async function loadRates(){const {data,error}=await db.from('shipping_rates').select('governorate,fee_egp');if(error){$('shippingRates').textContent='تعذر تحميل الأسعار: '+error.message;return}const map=new Map((data||[]).map(x=>[x.governorate,x.fee_egp]));$('shippingRates').innerHTML=governorates.map(g=>'<label class="fee">'+esc(g)+'<input class="shipFee" type="number" min="0" step="1" data-gov="'+esc(g)+'" value="'+Number(map.get(g)??0)+'"></label>').join('')}
$('saveShipping').onclick=async()=>{const btn=$('saveShipping');btn.disabled=true;$('shippingMsg').textContent='جارٍ حفظ الأسعار...';const rows=[...document.querySelectorAll('.shipFee')].map(x=>({governorate:x.dataset.gov,fee_egp:Number(x.value),updated_at:new Date().toISOString()}));if(rows.some(x=>!Number.isFinite(x.fee_egp)||x.fee_egp<0)){$('shippingMsg').textContent='تأكد أن الأسعار أرقام صفر أو أكبر.';btn.disabled=false;return}const {error}=await db.from('shipping_rates').upsert(rows,{onConflict:'governorate'});$('shippingMsg').textContent=error?'تعذر الحفظ: '+error.message:'تم حفظ مصاريف الشحن بنجاح.';$('shippingMsg').className=error?'error':'success';btn.disabled=false};
$('logout').onclick=async()=>{await db.auth.signOut();$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};
db.auth.getSession().then(({data})=>{if(data.session)showDashboard()});
</script></body></html>
